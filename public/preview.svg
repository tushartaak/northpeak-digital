<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Top Header Navigation -->
  <g transform="translate(0, 0)">
    <!-- Brand Logo -->
    <rect x="50" y="28" width="36" height="36" rx="10" fill="#2563eb"/>
    <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
    <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0f172a">North<tspan fill="#2563eb">Peak</tspan></text>

    <!-- Nav Links -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#475569">
      <text x="440" y="50">Services</text>
      <text x="530" y="50">Success Stories</text>
      <text x="670" y="50">Pricing</text>
      <text x="750" y="50">Contact</text>
    </g>

    <!-- Nav Buttons -->
    <g transform="translate(930, 26)">
      <!-- Estimator Button -->
      <rect x="0" y="0" width="110" height="40" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <path d="M16 14h8m-8 4h8m-8 4h4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2563eb">Estimator</text>

      <!-- Get Started Button -->
      <rect x="122" y="0" width="118" height="40" rx="10" fill="url(#blue-grad)"/>
      <text x="181" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Get Started</text>
    </g>
  </g>

  <!-- Wireframe 3D Geometric Art (Right Side) -->
  <g transform="translate(860, 350)">
    <!-- Outer Latitudes & Longitudes -->
    <ellipse cx="0" cy="0" rx="280" ry="280" fill="none" stroke="#2563eb" stroke-opacity="0.15" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="280" ry="140" fill="none" stroke="#2563eb" stroke-opacity="0.25" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="140" ry="280" fill="none" stroke="#2563eb" stroke-opacity="0.25" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="220" ry="220" fill="none" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Geometric Polyhedron Wireframe -->
    <polygon points="0,-240 180,-120 220,80 0,220 -220,80 -180,-120" fill="none" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.5"/>
    <polygon points="0,-180 140,-80 160,60 0,160 -160,60 -140,-80" fill="none" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Connecting Internal Structure Lines -->
    <line x1="0" y1="-240" x2="0" y2="220" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="-220" y1="80" x2="180" y2="-120" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="-180" y1="-120" x2="220" y2="80" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Inner Dense Polyhedron Ring -->
    <polygon points="0,-120 90,-50 110,40 0,100 -110,40 -90,-50" fill="none" stroke="#2563eb" stroke-opacity="0.5" stroke-width="1.5"/>
    
    <!-- Glowing Node Dots -->
    <circle cx="0" cy="-240" r="4" fill="#2563eb"/>
    <circle cx="180" cy="-120" r="4" fill="#3b82f6"/>
    <circle cx="220" cy="80" r="4" fill="#2563eb"/>
    <circle cx="0" cy="220" r="4" fill="#3b82f6"/>
    <circle cx="-220" cy="80" r="4" fill="#2563eb"/>
    <circle cx="-180" cy="-120" r="4" fill="#3b82f6"/>
    <circle cx="0" cy="0" r="5" fill="#2563eb"/>
    
    <!-- Floating Ambient Micro Nodes -->
    <rect x="-240" y="-180" width="4" height="4" fill="#3b82f6" opacity="0.6"/>
    <rect x="210" y="-190" width="3" height="3" fill="#2563eb" opacity="0.5"/>
    <rect x="250" y="140" width="4" height="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="-140" y="210" width="5" height="5" fill="#2563eb" opacity="0.6"/>
  </g>

  <!-- Left Main Hero Content -->
  <g transform="translate(60, 140)">
    <!-- Headline -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#0f172a" letter-spacing="-1.5">Scaling Digital</text>
    
    <!-- Gradient Highlighted Title Line -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#2563eb" letter-spacing="-1.5">Horizons</text>
      <!-- Highlight Underline Stroke -->
      <path d="M 4 18 Q 130 28 250 16" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Subtitle Description -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#475569" font-weight="400">
      <tspan x="0" dy="0">We build precision-engineered digital products that elevate</tspan>
      <tspan x="0" dy="28">brands and drive exponential growth. Experience the pinnacle of</tspan>
      <tspan x="0" dy="28">full-stack excellence.</tspan>
    </text>

    <!-- Call to Action Buttons -->
    <g transform="translate(0, 275)">
      <!-- Primary Button -->
      <g filter="url(#shadow)">
        <rect x="0" y="0" width="150" height="52" rx="14" fill="url(#blue-grad)"/>
        <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Get Started</text>
        <path d="M120 26l6 0m-3-3l3 3-3 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Secondary Button -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="130" height="52" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2563eb" text-anchor="middle">View Work</text>
      </g>
    </g>

    <!-- Metrics Stats Section -->
    <g transform="translate(0, 395)">
      <!-- Stat 1 -->
      <g>
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0f172a">99.9%</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">UPTIME SLA</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(145, 0)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#2563eb">100+</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">DEPLOYMENTS</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(290, 0)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#0f172a">Sub-100ms</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">LATENCY TARGET</text>
      </g>
    </g>
  </g>

  <!-- Bottom Right Cursor Badge -->
  <g transform="translate(1060, 615)">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M14 10l8 8-3.5 1 2.5 5-2 1-2.5-5L14 22V10z" fill="#2563eb"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3D Cursor: <tspan fill="#2563eb">ON</tspan></text>
  </g>
</svg>
